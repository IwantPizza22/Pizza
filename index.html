      pear: { name: 'Pear & Gorgonzola', ing: 'Pear, gorgonzola, mozzarella, walnuts, honey',

/* ============ ЯЗЫК ============ */
// Определяем по языку браузера: русский — RU, иначе EN
let lang = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch (e) {}
const t = () => translations[lang];

/* ============ ПИЦЦА И КУСКИ (SVG) ============ */
const NS = 'http://www.w3.org/2000/svg';
const R = IMG.r, N = ITEMS_META.length, STEP = 360 / N;
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const pt = (deg, rad) => [rad * Math.cos(deg * Math.PI / 180), rad * Math.sin(deg * Math.PI / 180)];

const svg = el('svg', { viewBox: `${-R} ${-R} ${2 * R} ${2 * R}` }, document.getElementById('stage'));
const defs = el('defs', {}, svg);
const RR = R * 1.02;
const labels = [], slices = [];

ITEMS_META.forEach((meta, i) => {
  const a1 = -90 + i * STEP, a2 = a1 + STEP, mid = (a1 + a2) / 2;
  const [x1, y1] = pt(a1, RR), [x2, y2] = pt(a2, RR);
  const d = `M0 0 L${x1} ${y1} A${RR} ${RR} 0 0 1 ${x2} ${y2} Z`;
  const clip = el('clipPath', { id: 'clip' + i }, defs);
  el('path', { d }, clip);

  const g = el('g', { class: 'slice', tabindex: 0, role: 'button' }, svg);
  const [ux, uy] = pt(mid, 1);
  g.style.setProperty('--ux', ux); g.style.setProperty('--uy', uy);
  g.style.setProperty('--hover', R * 0.09 + 'px');   // выдвижение при наведении
  g.style.setProperty('--fly', R * 1.5 + 'px');       // полёт при клике
  g.style.transformOrigin = `${R}px ${R}px`;

  const inner = el('g', { 'clip-path': `url(#clip${i})` }, g);
  el('image', { href: PIZZA_IMAGE_URL, x: -IMG.cx, y: -IMG.cy, width: IMG.w, height: IMG.h }, inner);
  el('path', { d, fill: 'transparent' }, inner);

  const flip = Math.cos(mid * Math.PI / 180) < 0;
  const [tx, ty] = pt(mid, R * 0.6);
  labels.push(el('text', { class: 'label', transform: `translate(${tx} ${ty}) rotate(${flip ? mid + 180 : mid})`, 'font-size': R * 0.062 }, g));
  slices.push(g);

  g.addEventListener('click', () => takeSlice(i));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); takeSlice(i); } });
});

/* ============ МОДАЛКА ============ */
const modal = document.getElementById('modal');
const body = document.getElementById('m-body');
let openIdx = null, current = null;

function takeSlice(i) {
  if (current !== null) return;
  current = i;
  slices[i].classList.add('taken');
  setTimeout(() => {
    const meta = ITEMS_META[i];
    if (meta.type === 'link') {                 // внешняя ссылка: открываем и возвращаем кусок
      window.open(meta.url, '_blank', 'noopener');
      setTimeout(giveBack, 600);
    } else {
      openIdx = i;
      resetMood();
      body.innerHTML = '';
      renderModal();
      modal.classList.add('open');
    }
  }, 750);
}
function giveBack() {
  modal.classList.remove('open');
  if (current !== null) slices[current].classList.remove('taken');
  current = null; openIdx = null;
}
document.getElementById('m-close').addEventListener('click', giveBack);
modal.addEventListener('click', e => { if (e.target === modal) giveBack(); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (lightbox.classList.contains('open')) closeLightbox(); else giveBack();   // сначала закрываем фото на весь экран
});

function renderModal() {
  if (openIdx === null) return;
  const meta = ITEMS_META[openIdx], it = t().items[openIdx];
  document.getElementById('m-close').textContent = t().ui.close;
  document.getElementById('m-close').className = meta.type === 'mood' ? 'btn small' : 'btn';
  const isArticle = meta.type === 'article';
  document.querySelector('.card').classList.toggle('wide', isArticle);
  const oldScroll = body.querySelector('.m-scroll');
  const keepTop = oldScroll ? oldScroll.scrollTop : 0;      // сохраняем прокрутку при смене языка
  if (meta.type === 'mood') renderMood();
  else if (isArticle) {
    renderArticle(meta.key);
    body.querySelector('.m-scroll').scrollTo({ top: keepTop, behavior: 'instant' });
  }
  else body.innerHTML = `<h2>${it.title}</h2><p>${it.text}</p>`;
}

/* ============ СТАТЬИ + LIGHTBOX ============ */
const lightbox = document.getElementById('lightbox');
function closeLightbox() { lightbox.classList.remove('open'); }
lightbox.addEventListener('click', closeLightbox);

function renderArticle(key) {
  const a = t().articles[key], photos = ARTICLE_PHOTOS[key];
  const figs = photos.map((src, i) =>
    `<figure class="shot"><div class="ph" data-i="${i}"><img src="${src}" alt="${a.captions[i]}" loading="lazy"></div><figcaption>${a.captions[i]}</figcaption></figure>`).join('');
  const secs = a.sections.map(s => `<h3>${s.h}</h3><p>${s.p}</p>`).join('');
  body.innerHTML = `
    <div class="m-head"><h2>${a.title}</h2><button class="x" id="m-x" aria-label="${t().ui.close}" title="${t().ui.close}">✕</button></div>
    <div class="m-scroll"><div class="prose">
      <p class="lead">${a.lead}</p>
      <div class="gallery">${figs}</div>
      ${secs}
    </div></div>`;
  document.getElementById('m-x').onclick = giveBack;
  body.querySelectorAll('.ph').forEach(box => box.addEventListener('click', () => {
    const i = +box.dataset.i;
    lightbox.querySelector('img').src = photos[i];
    lightbox.querySelector('.cap').textContent = a.captions[i];
    lightbox.classList.add('open');
  }));
}

/* ============ PIZZAMOOD ============ */
let mood = {};
function resetMood() { mood = { step: 0, answers: [], value: 5 }; }
resetMood();
const QN = 10;

// Умный подбор: учитываем средний балл и отдельные триггеры
function pickPizza(a) {
  const avg = a.reduce((s, v) => s + v, 0) / a.length;
  const calm = a[2], adventure = a[3], social = a[5];
  if (avg <= 2.5) return 'cheese';                       // всё совсем плохо
  if (calm <= 1) return 'antistress';                    // стресс зашкаливает — приоритет
  if (social <= 1 && avg >= 4) return 'hermit';          // нет сил на людей
  if (adventure >= 9 && avg >= 4.5) return 'diavola';    // жажда приключений
  if (avg < 4.5) return 'margherita';
  if (avg < 6.5) return 'pepperoni';
  if (avg < 8.5) return 'prosciutto';
  return 'pear';
}

function renderMood() {
  const u = t().ui;
  if (mood.step >= QN) return renderResult();
  const s = mood.step, v = mood.value;
  body.innerHTML = `
    <h2>${u.moodTitle}</h2>
    <div class="bar"><i style="width:${s / QN * 100}%"></i></div>
    <div class="cnt">${u.step(s + 1, QN)}</div>
    <h3 class="q">${t().questions[s]}</h3>
    <div class="val"><span class="num" id="num">${v}</span><span class="emo" id="emo">${FACES[v]}</span></div>
    <div class="st" id="st">${t().statuses[v]}</div>
    <input type="range" id="rng" min="0" max="10" step="1" value="${v}" style="--pct:${v * 10}%">
    <div class="ticks"><span>${u.lo}</span><span>${u.mid}</span><span>${u.hi}</span></div>
    <div class="row">
      <button class="btn ghost" id="back" ${s === 0 ? 'style="visibility:hidden"' : ''}>${u.back}</button>
      <button class="btn" id="next">${s === QN - 1 ? u.finish : u.next}</button>
    </div>`;
  const rng = document.getElementById('rng');
  rng.addEventListener('input', () => {
    const x = +rng.value; mood.value = x;
    rng.style.setProperty('--pct', x * 10 + '%');
    document.getElementById('num').textContent = x;
    document.getElementById('emo').textContent = FACES[x];
    document.getElementById('st').textContent = t().statuses[x];
  });
  document.getElementById('next').onclick = () => { mood.answers[s] = mood.value; mood.step++; mood.value = mood.answers[mood.step] ?? 5; renderMood(); };
  document.getElementById('back').onclick = () => { mood.step--; mood.value = mood.answers[mood.step] ?? 5; renderMood(); };
}

function renderResult() {
  const u = t().ui, key = pickPizza(mood.answers), p = t().pizzas[key];
  const avg = mood.answers.reduce((s, v) => s + v, 0) / QN;
  body.innerHTML = `
    <div class="res">
      <div class="big">${PIZZA_EMOJI[key]}</div>
      <h2>${p.name}</h2>
      <div class="ing">${p.ing}</div>
      <p>${p.why}</p>
      <div class="mt">${u.yourMood}: <b>${avg.toFixed(1)}</b> ${u.ofTen}</div>
      <div class="meter"><b style="left:${avg * 10}%"></b></div>
      <button class="btn" id="again" style="margin-top:14px">${u.restart}</button>
    </div>`;
  document.getElementById('again').onclick = () => { resetMood(); renderMood(); };
}

/* ============ ПРИМЕНЕНИЕ ЯЗЫКА ============ */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t().docTitle;
  labels.forEach((tx, i) => { tx.textContent = t().items[i].title; slices[i].setAttribute('aria-label', t().items[i].title); });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  renderModal();   // если окно открыто — перерисуем на новом языке (прогресс теста сохраняется)
}
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
}));
applyLang();
</script>
