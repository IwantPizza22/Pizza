/* ============ ЯЗЫК ============ */
// Определяем по языку браузера: русский — RU, иначе EN
let lang = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
try { lang = localStorage.getItem('lang') || lang; } catch (e) {}
const t = () => translations[lang];

/* ============ ПИЦЦА И КУСКИ (SVG) ============ */
const NS = 'http://www.w3.org/2000/svg';
const R = IMG.r, N = ITEMS_META.length, STEP = 360 / N;
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const pt = (deg, rad) => [rad * Math.cos(deg * Math.PI / 180), rad * Math.sin(deg * Math.PI / 180)];

const svg = el('svg', { viewBox: `${-R} ${-R} ${2 * R} ${2 * R}` }, document.getElementById('stage'));
const defs = el('defs', {}, svg);
const RR = R * 1.02;
const labels = [], slices = [];

ITEMS_META.forEach((meta, i) => {
  const a1 = -90 + i * STEP, a2 = a1 + STEP, mid = (a1 + a2) / 2;
  const [x1, y1] = pt(a1, RR), [x2, y2] = pt(a2, RR);
  const d = `M0 0 L${x1} ${y1} A${RR} ${RR} 0 0 1 ${x2} ${y2} Z`;
  const clip = el('clipPath', { id: 'clip' + i }, defs);
  el('path', { d }, clip);

  const g = el('g', { class: 'slice', tabindex: 0, role: 'button' }, svg);
  const [ux, uy] = pt(mid, 1);
  g.style.setProperty('--ux', ux); g.style.setProperty('--uy', uy);
  g.style.setProperty('--hover', R * 0.09 + 'px');   // выдвижение при наведении
  g.style.setProperty('--fly', R * 1.5 + 'px');       // полёт при клике
  g.style.transformOrigin = `${R}px ${R}px`;

  const inner = el('g', { 'clip-path': `url(#clip${i})` }, g);
  el('image', { href: PIZZA_IMAGE_URL, x: -IMG.cx, y: -IMG.cy, width: IMG.w, height: IMG.h }, inner);
  el('path', { d, fill: 'transparent' }, inner);

  const flip = Math.cos(mid * Math.PI / 180) < 0;
  const [tx, ty] = pt(mid, R * 0.6);
  labels.push(el('text', { class: 'label', transform: `translate(${tx} ${ty}) rotate(${flip ? mid + 180 : mid})`, 'font-size': R * 0.062 }, g));
  slices.push(g);

  g.addEventListener('click', () => takeSlice(i));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); takeSlice(i); } });
});

/* ============ МОДАЛКА ============ */
const modal = document.getElementById('modal');
const body = document.getElementById('m-body');
let openIdx = null, current = null;

function takeSlice(i) {
  if (current !== null) return;
  current = i;
  slices[i].classList.add('taken');
  setTimeout(() => {
    const meta = ITEMS_META[i];
    if (meta.type === 'game') {                 // мини-игра «Какая ты пицца?»
      window.pzOpen();
    } else if (meta.type === 'link') {                 // внешняя ссылка: открываем и возвращаем кусок
      window.open(meta.url, '_blank', 'noopener');
      setTimeout(giveBack, 600);
    } else {
      openIdx = i;
      resetMood();
      body.innerHTML = '';
      renderModal();
      modal.classList.add('open');
    }
  }, 750);
}
function giveBack() {
  modal.classList.remove('open');
  if (current !== null) slices[current].classList.remove('taken');
  current = null; openIdx = null;
}
document.getElementById('m-close').addEventListener('click', giveBack);
modal.addEventListener('click', e => { if (e.target === modal) giveBack(); });
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || document.getElementById('pz-ov').classList.contains('open')) return;
  if (lightbox.classList.contains('open')) closeLightbox(); else giveBack();   // сначала закрываем фото на весь экран
});

function renderModal() {
  if (openIdx === null) return;
  const meta = ITEMS_META[openIdx], it = t().items[openIdx];
  document.getElementById('m-close').textContent = t().ui.close;
  document.getElementById('m-close').className = meta.type === 'mood' ? 'btn small' : 'btn';
  const isArticle = meta.type === 'article';
  document.querySelector('.card').classList.toggle('wide', isArticle);
  const oldScroll = body.querySelector('.m-scroll');
  const keepTop = oldScroll ? oldScroll.scrollTop : 0;      // сохраняем прокрутку при смене языка
  if (meta.type === 'mood') renderMood();
  else if (isArticle) {
    renderArticle(meta.key);
    body.querySelector('.m-scroll').scrollTo({ top: keepTop, behavior: 'instant' });
  }
  else body.innerHTML = `<h2>${it.title}</h2><p>${it.text}</p>`;
}

/* ============ СТАТЬИ + LIGHTBOX ============ */
const lightbox = document.getElementById('lightbox');
function closeLightbox() { lightbox.classList.remove('open'); }
lightbox.addEventListener('click', closeLightbox);

function renderArticle(key) {
  const a = t().articles[key], photos = ARTICLE_PHOTOS[key];
  const figs = photos.map((src, i) =>
    `<figure class="shot"><div class="ph" data-i="${i}"><img src="${src}" alt="${a.captions[i]}" loading="lazy"></div><figcaption>${a.captions[i]}</figcaption></figure>`).join('');
  const secs = a.sections.map(s => `<h3>${s.h}</h3><p>${s.p}</p>`).join('');
  body.innerHTML = `
    <div class="m-head"><h2>${a.title}</h2><button class="x" id="m-x" aria-label="${t().ui.close}" title="${t().ui.close}">✕</button></div>
    <div class="m-scroll"><div class="prose">
      <p class="lead">${a.lead}</p>
      <div class="gallery">${figs}</div>
      ${secs}
    </div></div>`;
  document.getElementById('m-x').onclick = giveBack;
  body.querySelectorAll('.ph').forEach(box => box.addEventListener('click', () => {
    const i = +box.dataset.i;
    lightbox.querySelector('img').src = photos[i];
    lightbox.querySelector('.cap').textContent = a.captions[i];
    lightbox.classList.add('open');
  }));
}

/* ============ PIZZAMOOD ============ */
let mood = {};
function resetMood() { mood = { step: 0, answers: [], value: 5 }; }
resetMood();
const QN = 10;

// Умный подбор: учитываем средний балл и отдельные триггеры
function pickPizza(a) {
  const avg = a.reduce((s, v) => s + v, 0) / a.length;
  const calm = a[2], adventure = a[3], social = a[5];
  if (avg <= 2.5) return 'cheese';                       // всё совсем плохо
  if (calm <= 1) return 'antistress';                    // стресс зашкаливает — приоритет
  if (social <= 1 && avg >= 4) return 'hermit';          // нет сил на людей
  if (adventure >= 9 && avg >= 4.5) return 'diavola';    // жажда приключений
  if (avg < 4.5) return 'margherita';
  if (avg < 6.5) return 'pepperoni';
  if (avg < 8.5) return 'prosciutto';
  return 'pear';
}

function renderMood() {
  const u = t().ui;
  if (mood.step >= QN) return renderResult();
  const s = mood.step, v = mood.value;
  body.innerHTML = `
    <h2>${u.moodTitle}</h2>
    <div class="bar"><i style="width:${s / QN * 100}%"></i></div>
    <div class="cnt">${u.step(s + 1, QN)}</div>
    <h3 class="q">${t().questions[s]}</h3>
    <div class="val"><span class="num" id="num">${v}</span><span class="emo" id="emo">${FACES[v]}</span></div>
    <div class="st" id="st">${t().statuses[v]}</div>
    <input type="range" id="rng" min="0" max="10" step="1" value="${v}" style="--pct:${v * 10}%">
    <div class="ticks"><span>${u.lo}</span><span>${u.mid}</span><span>${u.hi}</span></div>
    <div class="row">
      <button class="btn ghost" id="back" ${s === 0 ? 'style="visibility:hidden"' : ''}>${u.back}</button>
      <button class="btn" id="next">${s === QN - 1 ? u.finish : u.next}</button>
    </div>`;
  const rng = document.getElementById('rng');
  rng.addEventListener('input', () => {
    const x = +rng.value; mood.value = x;
    rng.style.setProperty('--pct', x * 10 + '%');
    document.getElementById('num').textContent = x;
    document.getElementById('emo').textContent = FACES[x];
    document.getElementById('st').textContent = t().statuses[x];
  });
  document.getElementById('next').onclick = () => { mood.answers[s] = mood.value; mood.step++; mood.value = mood.answers[mood.step] ?? 5; renderMood(); };
  document.getElementById('back').onclick = () => { mood.step--; mood.value = mood.answers[mood.step] ?? 5; renderMood(); };
}

function renderResult() {
  const u = t().ui, key = pickPizza(mood.answers), p = t().pizzas[key];
  const avg = mood.answers.reduce((s, v) => s + v, 0) / QN;
  body.innerHTML = `
    <div class="res">
      <div class="big">${PIZZA_EMOJI[key]}</div>
      <h2>${p.name}</h2>
      <div class="ing">${p.ing}</div>
      <p>${p.why}</p>
      <div class="mt">${u.yourMood}: <b>${avg.toFixed(1)}</b> ${u.ofTen}</div>
      <div class="meter"><b style="left:${avg * 10}%"></b></div>
      <button class="btn" id="again" style="margin-top:14px">${u.restart}</button>
    </div>`;
  document.getElementById('again').onclick = () => { resetMood(); renderMood(); };
}

/* ============ ПРИМЕНЕНИЕ ЯЗЫКА ============ */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t().docTitle;
  labels.forEach((tx, i) => { tx.textContent = t().items[i].title; slices[i].setAttribute('aria-label', t().items[i].title); });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  renderModal();   // если окно открыто — перерисуем на новом языке (прогресс теста сохраняется)
}
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
}));
applyLang();
</script>

.pz-card{background:#16161a;border:1px solid var(--c,#2a2a32);border-radius:20px;padding:26px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 50px color-mix(in srgb,var(--c,#f5b800) 40%,transparent);animation:pzp .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pzp{from{transform:scale(.7);opacity:0}}
.pz-card img{width:150px;height:150px;object-fit:contain}
.pz-card h3{margin:6px 0;font-size:22px}.pz-card p{color:#bbb;line-height:1.5;font-size:14px;margin:0 0 16px}
.pz-rar{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--c)}
@media(max-width:760px){.pz-up{grid-template-columns:1fr 1fr}.pz-wheel-w{grid-column:1/-1;order:-1}.pz-slot{height:190px}.pz-slot img{width:76px;height:76px}.pz-two{grid-template-columns:1fr}.pz-it{width:112px}}
</style>

<div class="pz-ov" id="pz-ov"><div class="pz-wrap">
  <div class="pz-top">
    <div class="pz-logo">🍕Pizza<b>DEP</b></div>
    <button class="pz-tab on" data-t="case">Кейс</button><button class="pz-tab" data-t="up">Апгрейд</button>
    <button class="pz-ic" id="pz-snd" title="Звук">🔊</button><button class="pz-ic" id="pz-x" title="Закрыть">✕</button>
  </div>
  <div id="pz-case">
    <div class="pz-box"><div class="pz-roll"><div class="pz-mark"></div><div class="pz-strip" id="pz-strip"></div></div>
      <div class="pz-center"><button class="pz-btn" id="pz-go">^ Открыть кейс</button></div></div>
    <div class="pz-box"><h4 class="pz-h">Мой инвентарь пицц (<span id="pz-cnt">0</span>)</h4><div class="pz-grid" id="pz-inv"></div></div>
  </div>
  <div id="pz-up" style="display:none">
    <div class="pz-box">
      <div class="pz-up">
        <div class="pz-slot" id="pz-sa"></div>
        <div class="pz-wheel-w"><div class="pz-wheel">
          <svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" fill="none" stroke="#1e1e24" stroke-width="22"/>
          <circle id="pz-arc" cx="150" cy="150" r="120" fill="none" stroke="#ffaa00" stroke-width="22" stroke-linecap="butt" transform="rotate(-90 150 150)" style="filter:drop-shadow(0 0 8px #f5b800)"/>
          <g id="pz-nd" transform="rotate(0 150 150)"><line x1="150" y1="150" x2="150" y2="16" stroke="#fff" stroke-width="5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px #fff)"/><circle cx="150" cy="150" r="7" fill="#fff"/></g></svg>
          <div class="pz-wc"><b id="pz-pct">0.00%</b><span id="pz-pl">шанс успеха</span></div></div></div>
        <div class="pz-slot" id="pz-sb"></div>
      </div>
      <div class="pz-ctl"><button class="pz-btn" id="pz-spin" disabled>^ Прокачать</button>
        <span style="color:#777;font-size:13px">Шанс:</span>
        <button class="pz-chip" data-p="15">15%</button><button class="pz-chip" data-p="35">35%</button><button class="pz-chip" data-p="50">50%</button><button class="pz-chip" data-p="75">75%</button></div>
    </div>
    <div class="pz-two">
      <div class="pz-box"><h4 class="pz-h">Мои пиццы</h4><div class="pz-grid" id="pz-mine"></div></div>
      <div class="pz-box"><h4 class="pz-h">Получаемая пицца</h4>
        <div class="pz-fl"><button class="pz-chip on" data-r="all">Все</button><button class="pz-chip" data-r="common">Обычные</button><button class="pz-chip" data-r="rare">Редкие</button><button class="pz-chip" data-r="ultra">Ультра</button></div>
        <div class="pz-grid" id="pz-tgt"></div></div>
    </div>
  </div>
</div></div>
<div class="pz-res" id="pz-res"><div class="pz-card" id="pz-card"></div></div>

<script>
/* =====================================================================
   БАЗА ПИЦЦ. Чтобы подключить свои фото — положи файлы в images/pizzas/
   с указанными ниже именами (png). Пока файла нет — показывается заглушка.
   rarity: common (70%) | rare (25%) | ultra (5%)
   value: «крутость» в баллах — от неё считается шанс апгрейда
   ===================================================================== */
const PIZZA_DATABASE = [
  // ---------- ОБЫЧНЫЕ (синие) ----------
  {id:'margarita', name:'Маргарита', rarity:'common', image:'маргарита.png', value:100, description:'Классика без понтов. Ты надёжный, спокойный и всегда приходишь вовремя. Тебя любят все, даже те, кто «не любит томаты».'},
  {id:'pepperoni', name:'Пепперони', rarity:'common', image:'пепа.png', value:150, description:'Душа компании. Остренький характер, но в меру. Без тебя вечеринка — просто сборище людей.'},
  {id:'hawaiian', name:'Гавайская', rarity:'common', image:'гавайка.png', value:130, description:'Ананас на пицце? Ты не боишься споров и смело ломаешь стереотипы. Тебя либо обожают, либо яростно спорят с тобой.'},
  {id:'four-cheese', name:'Четыре сыра', rarity:'common', image:'4 сыра.png', value:200, description:'Ты — комфорт и уют. Мягкий, тянущийся, слегка тяжёлый на подъём. Идеален для вечера под пледом.'},
  {id:'ham-mushroom', name:'Ветчина и грибы', rarity:'common', image:'ветчинасыр.png', value:170, description:'Практичный и основательный. Ты тот, кто знает, где лежат документы, и всегда носит с собой зарядку.'},
  {id:'veggie', name:'Вегетарианская', rarity:'common', image:'вега.png', value:120, description:'Здоровый образ жизни — твой конёк. Ты напоминаешь друзьям про воду и режим сна, и они тебя за это терпят.'},
  {id:'chicken-ranch', name:'Цыплёнок Ранч', rarity:'common', image:'цыпленокранч.png', value:220, description:'Мягкий снаружи, с сюрпризом внутри. Ты умеешь удивить, оставаясь при этом душкой.'},
  {id:'mushroom', name:'Грибная', rarity:'common', image:'грибы.png', value:140, description:'Тихий мечтатель с глубоким внутренним миром. Любишь дождь, книги и одиночные прогулки.'},
  {id:'seafood-lite', name:'Тунец и лук', rarity:'common', image:'тунец.png', value:190, description:'Необычный выбор — необычный ты. Нестандартные решения твоя фишка, а запах уверенности — твой парфюм.'},
  {id:'cheeseburger', name:'Чизбургер-пицца', rarity:'common', image:'чизбургер.png', value:250, description:'Не можешь выбрать между двумя любимыми вещами — и берёшь обе. Жизнь слишком коротка для компромиссов.'},
  // ---------- РЕДКИЕ (фиолетовые) ----------
  {id:'pear-gorgonzola', name:'Груша и Горгонзола', rarity:'rare', image:'груша.png', value:700, description:'Утончённый эстет. Ты разбираешься в вине, джазе и умеешь красиво молчать. Не для всех — и ты это знаешь.'},
  {id:'meat-boom', name:'Мясной бум', rarity:'rare', image:'мяснойбум.png', value:800, description:'Ты — стихия. Громкий, щедрый, всегда голодный до жизни. Рядом с тобой никто не уходит голодным.'},
  {id:'diavola', name:'Дьябола', rarity:'rare', image:'диабло.png', value:900, description:'Огонь внутри и снаружи. Ты не терпишь скуку и любишь рисковать. Осторожно: можешь обжечь.'},
  {id:'bbq', name:'Барбекю', rarity:'rare', image:'барбек.png', value:850, description:'Дымный, душевный, с характером. Ты любишь компанию, огонь и истории «а вот однажды на даче».'},
  {id:'seafood', name:'С морепродуктами', rarity:'rare', image:'море.png', value:1100, description:'Свободолюбивый путешественник. Море — твоя стихия, а чемодан всегда наполовину собран.'},
  {id:'truffle', name:'Трюфельная', rarity:'rare', image:'трюф.png', value:1300, description:'Редкий и дорогой вкус. Ты умеешь ценить моменты и не размениваешься на мелочи.'},
  {id:'prosciutto-arugula', name:'Прошутто и руккола', rarity:'rare', image:'рукала.png', value:1000, description:'Лёгкий, стильный, с хрустящим чувством юмора. На всех фото ты выглядишь так, будто так и задумано.'},
  // ---------- УЛЬТРАРЕДКИЕ (золотые) ----------
  {id:'caviar-gold', name:'С чёрной икрой и сусальным золотом', rarity:'ultra', image:'икра.png', value:3000, description:'Ты — легенда. Блестишь даже в темноте, а твой чек лучше не показывать. Скромность? Не, не слышал.'},
  {id:'nutella-marshmallow', name:'Сладкая с Нутеллой и маршмеллоу', rarity:'ultra', image:'марш.png', value:2500, description:'Вечный ребёнок с гениальным чувством вкуса. Пока взрослые спорят о диете, ты уже счастлив.'},
  {id:'chef-secret', name:'Секретная пицца от шефа', rarity:'ultra', image:'шеф.png', value:5000, description:'Никто не знает, что внутри, — и в этом вся магия. Загадка, миф и лучший выбор вечера в одном лице.'}
];
const PZ_RARITY = {
  common:{name:'Обычная', color:'#3b82f6', weight:70},
  rare:{name:'Редкая', color:'#a855f7', weight:25},
  ultra:{name:'Ультраредкая', color:'#eab308', weight:5}
};
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const FB='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 92 L10 22 Q50 2 90 22Z" fill="#f2b44a" stroke="#c77d1a" stroke-width="3" stroke-linejoin="round"/><path d="M10 22 Q50 2 90 22" fill="none" stroke="#a8561a" stroke-width="7" stroke-linecap="round"/><circle cx="38" cy="32" r="6" fill="#c0392b"/><circle cx="60" cy="34" r="6" fill="#c0392b"/><circle cx="49" cy="56" r="6" fill="#c0392b"/><circle cx="48" cy="74" r="3.5" fill="#c0392b"/></svg>');
const img=p=>`<img src="${p.image}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${FB}'">`;
const byId=id=>PIZZA_DATABASE.find(p=>p.id===id);
const col=p=>PZ_RARITY[p.rarity].color;
let inv=[]; try{inv=JSON.parse(localStorage.getItem('pz_inv')||'[]').filter(x=>byId(x.id))}catch(e){}
const save=()=>{try{localStorage.setItem('pz_inv',JSON.stringify(inv))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let busy=false, snd=true;
/* ---------- ЗВУК ---------- */
let AC; const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,d,type='sine',v=.12,t0=0,f2){ if(!snd)return; try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
 o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}catch(e){} }
const tick=()=>tone(900+Math.random()*60,.05,'square',.04);
const winSnd=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.6,'triangle',.12,i*.09));
const loseSnd=()=>{tone(140,.5,'sawtooth',.14,0,45);tone(70,.6,'sine',.2,0,30)};
$('#pz-snd').onclick=()=>{snd=!snd;$('#pz-snd').textContent=snd?'🔊':'🔇'};
/* ---------- ОБЩЕЕ ---------- */
window.pzOpen=()=>{$('#pz-ov').classList.add('open');initStrip()};
const pzClose=()=>{if(busy)return;$('#pz-ov').classList.remove('open');$('#pz-res').classList.remove('open');giveBack()};
$('#pz-x').onclick=pzClose;
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#pz-ov').classList.contains('open'))pzClose()});
$$('.pz-tab').forEach(b=>b.onclick=()=>{if(busy)return;$$('.pz-tab').forEach(x=>x.classList.toggle('on',x===b));
 $('#pz-case').style.display=b.dataset.t==='case'?'':'none';$('#pz-up').style.display=b.dataset.t==='up'?'':'none';renderAll()});
const card=(p,extra='')=>`<div class="pz-it ${extra}" style="--c:${col(p)}" data-id="${p.id}">${img(p)}<span>${p.name}</span><small>${PZ_RARITY[p.rarity].name} · ${p.value}</small></div>`;
function popup(p,title,extra=''){const c=$('#pz-card');c.style.setProperty('--c',col(p));
 c.innerHTML=`<div class="pz-rar">${title}</div>${img(p)}<h3>${p.name}</h3><div class="pz-rar" style="margin-bottom:8px">${PZ_RARITY[p.rarity].name} · ${p.value} очк.</div><p>${p.description}</p>${extra}<button class="pz-btn" id="pz-okb">Круто!</button>`;
 $('#pz-res').classList.add('open');$('#pz-okb').onclick=()=>$('#pz-res').classList.remove('open')}
const ease=t=>1-Math.pow(1-t,4);
/* ---------- РУЛЕТКА ---------- */
const CW=138; let strip=$('#pz-strip');
function wpick(){let r=Math.random()*100,a=0;for(const k of ['common','rare','ultra']){a+=PZ_RARITY[k].weight;if(r<a){const l=PIZZA_DATABASE.filter(p=>p.rarity===k);return l[Math.random()*l.length|0]}}return PIZZA_DATABASE[0]}
const ultras=PIZZA_DATABASE.filter(p=>p.rarity==='ultra');
function initStrip(){ if(strip.children.length)return; const l=[];for(let i=0;i<14;i++)l.push(wpick());strip.innerHTML=l.map(p=>card(p)).join('');strip.style.transform='translateX(0)'}
function open(){ if(busy)return; busy=true;$('#pz-go').disabled=true;
 const win=wpick(),N=60,WI=50,l=[];
 for(let i=0;i<N;i++)l.push(wpick());
 if(Math.random()<.6){l[WI-3]=ultras[Math.random()*3|0];l[WI+2]=ultras[Math.random()*3|0]}
 l[WI]=win; strip.innerHTML=l.map(p=>card(p)).join('');
 // размеры карточки берём из реальной вёрстки (на телефоне карточка уже, чем на ПК)
 const c0=strip.children[0], c1=strip.children[1], step=c1.offsetLeft-c0.offsetLeft, cw=c0.offsetWidth;
 const vw=strip.parentElement.clientWidth, jit=(Math.random()-.5)*cw*.8;
 const end=-(WI*step+cw/2-vw/2+jit), dur=7000, t0=performance.now(); let last=0; strip.style.transform='translateX(0)';
 (function f(now){const t=Math.min((now-t0)/dur,1),x=end*ease(t);strip.style.transform=`translateX(${x}px)`;
  const k=Math.floor(-x/step); if(k!==last){last=k;tick()}
  if(t<1)requestAnimationFrame(f);else{inv.push({uid:uid(),id:win.id});save();renderAll();winSnd();popup(win,'Тебе выпала');busy=false;$('#pz-go').disabled=false}})(t0);
}
$('#pz-go').onclick=open;
/* ---------- АПГРЕЙДЕР ---------- */
let A=null,B=null,rf='all',rot=0;
const chanceOf=(a,b)=>Math.max(5,Math.min(80,a.value/b.value*90));
function renderSlots(){
 const sa=$('#pz-sa'),sb=$('#pz-sb');
 sa.className='pz-slot'+(A?' has':'');sb.className='pz-slot'+(B?' has':'');
 sa.style.setProperty('--c',A?col(byId(A.id)):'');sb.style.setProperty('--c',B?col(B):'');
 sa.innerHTML=A?`${img(byId(A.id))}<div>${byId(A.id).name}</div><div class="pz-v">${byId(A.id).value} очк.</div>`:'<div class="pz-chev">^<br>^</div>Выбери пиццу, которую хочешь прокачать';
 sb.innerHTML=B?`${img(B)}<div>${B.name}</div><div class="pz-v">${B.value} очк.</div>`:'<div class="pz-chev">^<br>^</div>Выбери пиццу, которую хочешь получить';
 const ok=A&&B,ch=ok?chanceOf(byId(A.id),B):0,C=2*Math.PI*120;
 $('#pz-arc').setAttribute('stroke-dasharray',`${C*ch/100} ${C}`);
 $('#pz-pct').textContent=ch.toFixed(2)+'%';
 $('#pz-pl').textContent=!ok?'выбери пиццы':ch>=60?'высокий шанс':ch>=30?'средний шанс':'низкий шанс';
 $('#pz-spin').disabled=!ok||busy;
}
function renderLists(){
 $('#pz-mine').innerHTML=inv.length?inv.slice().sort((a,b)=>byId(b.id).value-byId(a.id).value).map(x=>card(byId(x.id),A&&A.uid===x.uid?'sel':'').replace('data-id="','data-u="'+x.uid+'" data-id="')).join(''):'<div class="pz-empty">Пусто. Открой кейс!</div>';
 const base=A?byId(A.id).value:0;
 const l=PIZZA_DATABASE.filter(p=>p.value>base&&(rf==='all'||p.rarity===rf)).sort((a,b)=>a.value-b.value);
 $('#pz-tgt').innerHTML=l.length?l.map(p=>card(p,B&&B.id===p.id?'sel':'')).join(''):'<div class="pz-empty">Нет более крутых пицц</div>';
 $$('#pz-mine .pz-it').forEach(e=>e.onclick=()=>{if(busy)return;A=inv.find(x=>x.uid===e.dataset.u);if(B&&B.value<=byId(A.id).value)B=null;renderAll()});
 $$('#pz-tgt .pz-it').forEach(e=>e.onclick=()=>{if(busy)return;B=byId(e.dataset.id);renderAll()});
}
function renderAll(){
 $('#pz-cnt').textContent=inv.length;
 $('#pz-inv').innerHTML=inv.length?inv.slice().reverse().map(x=>card(byId(x.id))).join(''):'<div class="pz-empty">Пока пусто — открой первый кейс</div>';
 if(A&&!inv.find(x=>x.uid===A.uid))A=null; renderSlots();renderLists();
}
$$('.pz-fl .pz-chip').forEach(b=>b.onclick=()=>{rf=b.dataset.r;$$('.pz-fl .pz-chip').forEach(x=>x.classList.toggle('on',x===b));renderLists()});
$$('.pz-ctl .pz-chip').forEach(b=>b.onclick=()=>{if(busy)return;
 if(!A){$('#pz-sa').classList.add('pz-shake');setTimeout(()=>$('#pz-sa').classList.remove('pz-shake'),500);return}
 const a=byId(A.id),want=+b.dataset.p,l=PIZZA_DATABASE.filter(p=>p.value>a.value);if(!l.length)return;
 B=l.reduce((m,p)=>Math.abs(chanceOf(a,p)-want)<Math.abs(chanceOf(a,m)-want)?p:m);renderAll()});
$('#pz-spin').onclick=()=>{ if(busy||!A||!B)return; busy=true;$('#pz-spin').disabled=true;
 const a=byId(A.id),ch=chanceOf(a,B),zone=ch*3.6,win=Math.random()*100<ch;
 const ang=win?zone*(.05+Math.random()*.9):zone+(360-zone)*(.05+Math.random()*.9);
 const from=rot%360,end=rot-from+360*6+ang,dur=6000,t0=performance.now(),nd=$('#pz-nd');let last=0;
 (function f(now){const t=Math.min((now-t0)/dur,1),r=from+(end-from)*ease(t)-(0);nd.setAttribute('transform',`rotate(${r} 150 150)`);
  const k=Math.floor(r/12);if(k!==last){last=k;tick()}
  if(t<1)requestAnimationFrame(f);else{rot=end;finish(win,a)}})(t0);
};
function finish(win,a){
 if(win){inv=inv.filter(x=>x.uid!==A.uid);inv.push({uid:uid(),id:B.id});save();winSnd();const nb=B;A=null;B=null;busy=false;renderAll();popup(nb,'Апгрейд успешен!')}
 else{loseSnd();const s=$('#pz-sa');s.classList.add('pz-shake');
  setTimeout(()=>{inv=inv.filter(x=>x.uid!==A.uid);save();A=null;busy=false;renderAll();
   const c=$('#pz-card');c.style.setProperty('--c','#e11');c.innerHTML=`<div style="font-size:60px">🔥</div><h3>Неудача</h3><p>Пицца «${a.name}» сгорела в печи. Попробуй ещё раз!</p><button class="pz-btn" id="pz-okb">Ладно</button>`;
   $('#pz-res').classList.add('open');$('#pz-okb').onclick=()=>$('#pz-res').classList.remove('open')},700)}
}
renderAll();
})();
</script>
<!-- ===================== /PZ ===================== -->
</body>
</html>
